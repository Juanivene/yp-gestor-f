name: ypf-dev

# Solo Postgres, expuesto en localhost:5432, para desarrollar con `npm run dev`.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ypf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ypf_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-ypf}
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata_dev:
